server {
    listen 80;
    server_name signin.saama.cloud;
    
    # Root directory
    root /var/www/saama-maintenance;
    index index.html;
    
    # Disable server tokens
    server_tokens off;
    
    # Security headers (ALB will add HSTS and other headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=maintenance:10m rate=10r/s;
    limit_req zone=maintenance burst=20 nodelay;
    
    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint for ALB
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Main location
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for static assets
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Deny access to sensitive files
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }
    
    # Custom error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
    
    # Logging
    access_log /var/log/nginx/saama-maintenance-access.log;
    error_log /var/log/nginx/saama-maintenance-error.log;
}
